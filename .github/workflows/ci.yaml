name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rokit
      uses: CompeyDev/setup-rokit@v0.2.1

    - name: Lint
      run: |
        selene ./lib

  style:
    name: Styling
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: JohnnyMorganz/stylua-action@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        version: v2.5.2
        args: --check ./lib
